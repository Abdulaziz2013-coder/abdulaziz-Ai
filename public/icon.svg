<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-dasharray="24 16" opacity="0.6" />
  
  <!-- Central Glowing Letter A -->
  <path d="M256 110 L370 380 L305 380 L280 320 L232 320 L207 380 L142 380 Z M256 195 L242 270 L270 270 Z" fill="url(#brandGrad)" filter="url(#glow)" />

  <!-- Server Online Dot -->
  <circle cx="410" cy="110" r="28" fill="#10b981" filter="url(#glow)" />
  <circle cx="410" cy="110" r="16" fill="#ecfdf5" />
</svg>
